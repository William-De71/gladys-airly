<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Airly integration for Gladys Assistant (illustration, not
       the logo of Airly). Old-town towers in a hazy winter dusk, under a dial
       of the CAQI in the five colors of its levels. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304a"/>
      <stop offset="0.6" stop-color="#5b7a99"/>
      <stop offset="1" stop-color="#d9c7a3"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ece2cf" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- the old town: roofs and two church towers -->
  <g fill="#18233a">
    <path d="M0 534 V430 L30 410 L60 430 V400 L95 380 L130 400 V420 H160 V380 L175 360 L190 380 V300 L205 250 L220 300 V380 H250 V410 L285 385 L320 410 V330 L335 290 L342 270 L349 290 L364 330 V410 H400 V395 L440 370 L480 395 V420 H520 V380 L555 355 L590 380 V430 L620 410 L650 430 V400 L690 380 L730 400 V425 L770 405 L800 420 V534 Z"/>
  </g>
  <g fill="#f3d58a" opacity="0.7">
    <rect x="200" y="320" width="8" height="12"/><rect x="200" y="345" width="8" height="12"/>
    <rect x="337" y="345" width="8" height="12"/><rect x="337" y="370" width="8" height="12"/>
    <rect x="430" y="400" width="8" height="10"/><rect x="545" y="390" width="8" height="10"/>
    <rect x="100" y="410" width="8" height="10"/><rect x="690" y="410" width="8" height="10"/>
  </g>
  <rect y="280" width="800" height="254" fill="url(#haze)"/>

  <!-- the CAQI dial: five arcs, very low to very high -->
  <g transform="translate(590 250)" fill="none" stroke-width="34" stroke-linecap="butt">
    <path d="M-150 0 A150 150 0 0 1 -121.4 -88.2" stroke="#6bc926"/>
    <path d="M-121.4 -88.2 A150 150 0 0 1 -46.4 -142.7" stroke="#d1cf1e"/>
    <path d="M-46.4 -142.7 A150 150 0 0 1 46.4 -142.7" stroke="#efbb0f"/>
    <path d="M46.4 -142.7 A150 150 0 0 1 121.4 -88.2" stroke="#ef7120"/>
    <path d="M121.4 -88.2 A150 150 0 0 1 150 0" stroke="#d8392f"/>
  </g>
  <g transform="translate(590 250)">
    <path d="M0 0 L-83 -82" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle r="16" fill="#ffffff"/>
    <text y="62" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">44</text>
    <text y="94" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#e8eef7">CAQI · PM2.5 26.6</text>
  </g>

  <!-- the title -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="48" y="110" font-size="70" font-weight="bold" fill="#ffffff">Airly</text>
    <text x="52" y="152" font-size="26" fill="#dbe7f5">for Gladys Assistant</text>
    <text x="52" y="196" font-size="19" fill="#c3d4ea">CAQI · PM2.5 · PM10 · forecast</text>
  </g>
</svg>
